apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://clickhouse:8123
    basicAuth: false
    isDefault: true
    jsonData:
      defaultDatabase: logs
      server: clickhouse
      port: 8123
      protocol: http
      secure: false
    editable: false

